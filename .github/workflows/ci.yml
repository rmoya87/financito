name: CI
on:
  push:
    branches: [main, 'implementation/**']
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - run: python scripts/check_docs.py
      - run: bash -n Financito.command Financito-sin-actualizar.command scripts/mac-runner.sh
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - run: pip install -e 'apps/api[dev]'
      - run: PYTHONPATH=apps/api FINANCITO_ALLOW_PLAINTEXT_SQLITE=1 FINANCITO_DATA_DIR=/tmp/financito-ci FINANCITO_VAULT_DIR=/tmp/financito-ci/vault python -m compileall -q apps/api/financito
      - run: PYTHONPATH=apps/api FINANCITO_ALLOW_PLAINTEXT_SQLITE=1 FINANCITO_DATA_DIR=/tmp/financito-ci FINANCITO_VAULT_DIR=/tmp/financito-ci/vault pytest apps/api/tests
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: pip install -e 'apps/api[dev]'
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start local Financito
        run: |
          mkdir -p /tmp/financito-e2e/vault
          cat > /tmp/financito-e2e/vault/e2e-policy.txt <<'EOF'
          Póliza de seguro de hogar E2E.
          Prima anual 240 euros.
          Franquicia 150 euros.
          Preaviso de 30 días para cancelar.
          EOF
          PYTHONPATH=apps/api \
          FINANCITO_ALLOW_PLAINTEXT_SQLITE=1 \
          FINANCITO_DATA_DIR=/tmp/financito-e2e \
          FINANCITO_VAULT_DIR=/tmp/financito-e2e/vault \
          FINANCITO_FRONTEND_DIR=$GITHUB_WORKSPACE/apps/web/out \
          python -m uvicorn financito.main:app --host 127.0.0.1 --port 8765 > /tmp/financito-e2e.log 2>&1 &
          echo $! > /tmp/financito-e2e.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8765/api/v1/session >/dev/null; then exit 0; fi
            sleep .5
          done
          cat /tmp/financito-e2e.log
          exit 1
      - run: npm run test:e2e
        working-directory: apps/web
        env:
          FINANCITO_E2E_URL: http://127.0.0.1:8765
      - if: failure()
        run: cat /tmp/financito-e2e.log || true
