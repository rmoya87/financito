name: Bootstrap implementation

on:
  push:
    branches:
      - implementation/financito-v1
    paths:
      - scripts/.bootstrap/chunk_07

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/financito-v1
          fetch-depth: 0

      - name: Materialize source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/.bootstrap/chunk_07
          cat scripts/.bootstrap/chunk_* > /tmp/financito.b64
          base64 --decode /tmp/financito.b64 > /tmp/financito-implementation.tar.gz
          tar -xzf /tmp/financito-implementation.tar.gz -C .
          rm -rf scripts/.bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: implement Financito local-first v1 [skip ci]"
          git push origin HEAD:implementation/financito-v1
