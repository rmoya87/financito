[project]
name="financito-api"
version="0.2.0"
description="Financito local-first financial API"
requires-python=">=3.12"
dependencies=[
 "fastapi>=0.128,<1","uvicorn[standard]>=0.48,<1","pydantic>=2.13,<3","sqlalchemy>=2.0,<3",
 "python-multipart>=0.0.20,<1","pypdf>=6,<7","python-docx>=1.2,<2","openpyxl>=3.1,<4",
 "pillow>=11,<12","pytesseract>=0.3.13,<1","httpx>=0.28,<1","cryptography>=46,<52",
 "keyring>=25,<27","sqlcipher3>=0.6.2,<1","sqlite-vec>=0.1.9,<0.2","PyJWT[crypto]>=2.10,<3","defusedxml>=0.7,<1"
]
[project.optional-dependencies]
dev=["pytest>=9,<10"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
addopts="-q"
